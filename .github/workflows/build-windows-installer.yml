name: 构建 Windows 安装包(Tauri)

# 方案 C(docs/桌面App分发方案设计.md §5,M2):Tauri 壳 + node sidecar 的 NSIS 安装包。
#
# 与 zip 工作流(build-windows-package.yml)的差异:
#   - sidecar 不做 JS 打包(pkg/SEA):安装形态下文件落盘本是常态,
#     直接用官方 node.exe + next-server 目录,绕开动态 require 兼容性顽疾
#   - 听力 mp3(public/exams/shared/exam-assets/listening-*.mp3, ~4.7GB)在组装后
#     剔除并单独出 zip 分卷:NSIS 压缩数据超 2GiB 必报
#     "Internal compiler error #12345: error mmapping datablock"(makensis 32 位
#     程序的硬限制,无配置可解,tauri#7372 同款)。mp3 几乎不可压缩,必须物理剔除。
#     仅影响安装包;本地开发与 next-server 产物不含此剔除。
#
# 用法:GitHub 仓库页 → Actions → 本工作流 → Run workflow

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 同时作为 Release 资产上传(需先有 tag 推送)
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 启用 Windows 长路径(questions/ 真题目录文件名超 MAX_PATH,checkout 必挂)
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: 资产路径长度门禁(防 makensis/zip 撞 MAX_PATH)
        # public/ 与 prototype/ 下的爬虫原始整句标题文件名会进入 NSIS 资源,
        # 触发 makensis 报 'failed opening file ...'。提前报错优于在
        # tauri build 末尾才暴露(那时已浪费 5+ 分钟 Rust 编译)。
        # 注意:PowerShell 对中文+括号+分号混排的解析敏感,这里走 if 分支避免 one-liner 嵌套。
        shell: pwsh
        run: |
          node scripts/check-asset-paths.mjs
          if ($LASTEXITCODE -ne 0) {
            Write-Error "资产路径长度超阈值。请运行 scripts/normalize-questions-filenames.mjs 治理 questions/，并人工处理 public/prototype 中的超长文件名"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # 不用 cache: npm —— 缓存恢复曾致 npm ci 清理 EPERM 后走降级路径,
          # 对免编译的 better-sqlite3 v13(包内 prebuilds)误触发 node-gyp rebuild

      - name: 安装依赖并根除 better-sqlite3 误触发源码编译
        # 根因:better-sqlite3 v13 是纯 prebuildify 分发(无 install 脚本),但包内
        #   binding.gyp 触发 npm 自动 node-gyp rebuild → 撞 Windows runner 的 VS 2026
        #   (node-gyp 11.5 识别范围只到 VS 2022) → 编译失败。
        # 修法:`--ignore-scripts` 一次禁掉所有 install 脚本,再 `npm rebuild` 仅对
        #   真正需要 postinstall 的 esbuild/unrs-resolver 单独触发(它们是拉平台预编译二进制)。
        # 副作用:fsevents 是 darwin only,Windows 自动跳过;其它 4 个 esbuild 副本只需 rebuild 一份即可。
        # 替代方案(放弃):修改 package-lock.json 注入 gypfile:false —— npm ci 会校验 lock drift
        #   直接拒装。
        shell: pwsh
        run: |
          # 装依赖但禁所有 install 脚本
          npm ci --ignore-scripts --no-audit --no-fund --foreground-scripts
          # 单独重建需要 postinstall 的包(拉平台预编译二进制)
          npm rebuild esbuild unrs-resolver --no-audit --no-fund --foreground-scripts
          # 校验:不应再生成 build/ 目录
          if (Test-Path node_modules/better-sqlite3/build) {
            Write-Error "better-sqlite3 仍有 build/ 目录,prebuild 路径未生效"; exit 1
          } else { Write-Output "确认: better-sqlite3 无 build/ 目录,走 prebuild ✓" }

      - name: 自检 better-sqlite3 预编译二进制
        shell: pwsh
        run: |
          # 注意调用形式:better-sqlite3 v13 的 CommonJS 导出就是 Database 类本身,
          # 不是 { Database } 命名空间。正确写法:const Database = require(...); new Database(...)
          $r = node -e "const Database=require('better-sqlite3'); const d=new Database(':memory:'); console.log('better-sqlite3 prebuild 加载 OK, sqlite ' + d.prepare('select sqlite_version() v').get().v)"
          if ($LASTEXITCODE -ne 0) { Write-Error "better-sqlite3 加载失败(见上方输出)"; exit 1 }
          Write-Output $r

      - name: 构建(postbuild 自动产出 next-server/)
        run: npm run build

      - name: 组装 Tauri 资源(server/ + runtime/node.exe + runtime/node)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/server, src-tauri/runtime | Out-Null
          # next-server 内容平铺进 server/(server.js 必须位于 src-tauri/server/server.js)
          Copy-Item next-server/* src-tauri/server -Recurse -Force
          # node.exe 直接复用 runner 的 setup-node 安装(22.x,与 npm ci 运行时同版本;
          # better-sqlite3 走 NAPI prebuilds,小版本无 ABI 问题)
          # 拷两份:runtime/node.exe 是 Windows 实际启动用的;
          # runtime/node 是 tauri-build 出包阶段校验用的(tauri.conf.json resources
          # 数组声明了两个文件名,跨平台出包都要两个文件都存在)
          $node = (Get-Command node).Source
          Copy-Item $node src-tauri/runtime/node.exe
          Copy-Item $node src-tauri/runtime/node
          "node.exe 大小: {0:N1} MB" -f ((Get-Item src-tauri/runtime/node.exe).Length/1MB)
          "server/ 文件数: $((Get-ChildItem src-tauri/server -Recurse -File).Count)"

      - name: 剔除听力 mp3 并出分卷 zip(NSIS 2GiB 硬限制)
        # 4.7GB 听力音频若进 NSIS,压缩数据必超 2GiB → makensis
        # "Internal compiler error #12345: error mmapping datablock"。
        # 仅从打包副本(src-tauri/server/public)剔除,源目录与 next-server 不动。
        # zip 按年份分卷(-0 仅存储,mp3 压缩率≈0),单卷均 <2GiB Release 资产上限。
        shell: pwsh
        run: |
          $assets = "src-tauri/server/public/exams/shared/exam-assets"
          $mp3s = Get-ChildItem $assets -Filter "listening-*.mp3" -ErrorAction SilentlyContinue
          if (-not $mp3s) { Write-Output "无听力 mp3,跳过剔除"; exit 0 }
          "剔除前 exam-assets: {0:N0} MB, {1} 个文件" -f (($mp3s | Measure-Object Length -Sum).Sum/1MB), $mp3s.Count
          New-Item -ItemType Directory -Force dist-listening | Out-Null
          foreach ($year in "2022","2023","2024","2025") {
            $batch = $mp3s | Where-Object { $_.Name -match "listening-.*-$year" }
            if ($batch) {
              $zip = "dist-listening/ielts-listening-$year.zip"
              Compress-Archive -Path ($batch.FullName) -DestinationPath $zip -CompressionLevel NoCompression
              "zip $year : {0:N0} MB, {1} 个" -f ((Get-Item $zip).Length/1MB), $batch.Count
            }
          }
          $other = $mp3s | Where-Object { $_.Name -notmatch "listening-.*-20(22|23|24|25)" }
          if ($other) {
            $zip = "dist-listening/ielts-listening-misc.zip"
            Compress-Archive -Path ($other.FullName) -DestinationPath $zip -CompressionLevel NoCompression
            "zip misc: {0:N0} MB, {1} 个" -f ((Get-Item $zip).Length/1MB), $other.Count
          }
          $mp3s | Remove-Item -Force
          "剔除后 server/: {0:N0} MB" -f ((Get-ChildItem src-tauri/server -Recurse -File | Measure-Object Length -Sum).Sum/1MB)

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri 构建(NSIS per-user 安装包)
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@^2 build
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: ielts-copilot-setup-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: 上传听力 zip 分卷(NSIS 剔除部分,解压回装到 server/public/exams/shared/exam-assets)
        uses: actions/upload-artifact@v4
        with:
          name: ielts-listening-audio-${{ github.run_number }}
          path: dist-listening/*.zip
          retention-days: 30

      - name: 上传到 Release(可选)
        if: ${{ inputs.upload_release }}
        shell: pwsh
        run: |
          gh release upload "${{ github.ref_name }}" (Get-Item src-tauri/target/release/bundle/nsis/*.exe).FullName --clobber
          if (Test-Path dist-listening) {
            gh release upload "${{ github.ref_name }}" (Get-Item dist-listening/*.zip).FullName --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
