name: 构建 Windows 安装包(Tauri)

# 方案 C(docs/桌面App分发方案设计.md §5,M2):Tauri 壳 + node sidecar 的 NSIS 安装包。
#
# 与 zip 工作流(build-windows-package.yml)的差异:
#   - 产物是 per-user 安装包(Setup.exe),客户机免 Node、免构建、免联网
#   - sidecar 不做 JS 打包(pkg/SEA):安装形态下文件落盘本是常态,
#     直接用官方 node.exe + next-server 目录,绕开动态 require 兼容性顽疾
#   - resources 体量大(public ~259MB),NSIS LZMA 压缩需 10-20 分钟,属正常
#
# 用法:GitHub 仓库页 → Actions → 本工作流 → Run workflow

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 同时作为 Release 资产上传(需先有 tag 推送)
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 启用 Windows 长路径(questions/ 真题目录文件名超 MAX_PATH,checkout 必挂)
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # 不用 cache: npm —— 缓存恢复曾致 npm ci 清理 EPERM 后走降级路径,
          # 对免编译的 better-sqlite3 v13(包内 prebuilds)误触发 node-gyp rebuild

      - name: 安装依赖
        # --foreground-scripts: 任何 install 脚本的输出前置到主日志,
        # 若再误触发编译可直接看到调用者
        run: npm ci --no-audit --no-fund --foreground-scripts

      - name: 自检 better-sqlite3 预编译二进制(免编译安装是否生效)
        shell: pwsh
        run: |
          $r = node -e "const b=require('better-sqlite3'); const d=new b.Database(':memory:'); console.log('better-sqlite3 prebuild 加载 OK, sqlite ' + d.prepare('select sqlite_version() v').get().v)"
          if ($LASTEXITCODE -ne 0) { Write-Error "better-sqlite3 加载失败(见上方输出,疑似走了源码编译)"; exit 1 }
          Write-Output $r
          $p = Join-Path (Get-Location) "node_modules/better-sqlite3/build"
          if (Test-Path $p) { Write-Output "警告: 存在 build/ 目录(源码编译产物),安装未走 prebuild 路径" } else { Write-Output "确认: 无 build/ 目录,使用包内 prebuild ✓" }

      - name: 构建(postbuild 自动产出 next-server/)
        run: npm run build

      - name: 组装 Tauri 资源(server/ + runtime/node.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/server, src-tauri/runtime | Out-Null
          # next-server 内容平铺进 server/(server.js 必须位于 src-tauri/server/server.js)
          Copy-Item next-server/* src-tauri/server -Recurse -Force
          # node.exe 直接复用 runner 的 setup-node 安装(22.x,与 npm ci 运行时同版本;
          # better-sqlite3 走 NAPI prebuilds,小版本无 ABI 问题)
          $node = (Get-Command node).Source
          Copy-Item $node src-tauri/runtime/node.exe
          "node.exe 大小: {0:N1} MB" -f ((Get-Item src-tauri/runtime/node.exe).Length/1MB)
          "server/ 文件数: $((Get-ChildItem src-tauri/server -Recurse -File).Count)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri 构建(NSIS per-user 安装包)
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@^2 build
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: ielts-copilot-setup-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: 上传到 Release(可选)
        if: ${{ inputs.upload_release }}
        shell: pwsh
        run: gh release upload "${{ github.ref_name }}" (Get-Item src-tauri/target/release/bundle/nsis/*.exe).FullName --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
