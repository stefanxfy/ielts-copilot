[package]
name = "ielts-copilot"
version = "0.1.0"
description = "IELTS Copilot · 本地雅思备考桌面应用"
edition = "2021"

# NSIS 安装包产物名基
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(windows)".dependencies]
# Job Object 回收 sidecar 进程树(仅 Win 编译,docs/桌面App分发方案设计.md §5.4)
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
