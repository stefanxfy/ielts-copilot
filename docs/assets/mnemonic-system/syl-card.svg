<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="100%" role="img">
  <title>音节解析卡双层结构（v2.2）</title>
  <desc>音节层(parts/ipa/stress)管读的节奏, 音素层(phonemes/combos/notes)管每个音怎么发; LLM 结构化生成落库 contentJson.syl, 拼接校验拒收, 缺数据运行时规则兜底; literature 示例</desc>

  <rect x="0" y="0" width="680" height="580" fill="#FFFFFF"/>
  <text x="40" y="32" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">音节解析卡 · 双层结构（音节 + 音素）— literature 示例</text>
  <text x="40" y="50" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">LLM 结构化生成落库 contentJson.syl · 音素按音节分组 · 元音/辅音着色 · 「音素细讲」抽屉</text>

  <!-- ① 卡片渲染 -->
  <text x="40" y="86" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#0C447C">① 卡片渲染 · 径向助记卡（揭示后）</text>
  <rect x="20" y="96" width="310" height="380" rx="8" fill="#FAF7F0" stroke="#E5DFD0" stroke-width="1"/>

  <text x="175" y="124" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">literature</text>
  <text x="175" y="142" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#5F5E5A">/ˈlɪtərətʃə/ ▶</text>

  <!-- 重音圆点 + 音节四段色块 -->
  <circle cx="104" cy="152" r="3.5" fill="#B3421E"/>
  <rect x="80" y="158" width="48" height="26" rx="5" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.8"/>
  <text x="104" y="175" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="600" fill="#0C447C">lit</text>
  <rect x="134" y="158" width="28" height="26" rx="5" fill="#EAF3DE" stroke="#97C459" stroke-width="0.8"/>
  <text x="148" y="175" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="600" fill="#3F6328">e</text>
  <rect x="168" y="158" width="38" height="26" rx="5" fill="#FAEEDB" stroke="#C2904A" stroke-width="0.8"/>
  <text x="187" y="175" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="600" fill="#6B4614">ra</text>
  <rect x="212" y="158" width="58" height="26" rx="5" fill="#F5E8E1" stroke="#D08F6A" stroke-width="0.8"/>
  <text x="241" y="175" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="600" fill="#7A2F1F">ture</text>

  <!-- 音素条 -->
  <text x="32" y="204" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#888780">音素（按音节分组）</text>
  <rect x="200" y="196" width="10" height="10" rx="3" fill="#FBE4E0"/>
  <text x="214" y="205" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#888780">元音</text>
  <rect x="248" y="196" width="10" height="10" rx="3" fill="#DFEAFA"/>
  <text x="262" y="205" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#888780">辅音</text>

  <rect x="32" y="210" width="286" height="30" rx="8" fill="#F1EEE6"/>
  <rect x="40" y="216" width="20" height="18" rx="5" fill="#DFEAFA"/>
  <text x="50" y="229" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#2B5DA8">l</text>
  <rect x="63" y="216" width="20" height="18" rx="5" fill="#FBE4E0"/>
  <text x="73" y="229" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#B3421E">ɪ</text>
  <rect x="86" y="216" width="20" height="18" rx="5" fill="#DFEAFA"/>
  <text x="96" y="229" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#2B5DA8">t</text>
  <text x="114" y="229" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="10" fill="#888780">·</text>
  <rect x="122" y="216" width="20" height="18" rx="5" fill="#FBE4E0"/>
  <text x="132" y="229" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#B3421E">ə</text>
  <text x="150" y="229" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="10" fill="#888780">·</text>
  <rect x="158" y="216" width="20" height="18" rx="5" fill="#DFEAFA"/>
  <text x="168" y="229" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#2B5DA8">r</text>
  <rect x="181" y="216" width="20" height="18" rx="5" fill="#FBE4E0"/>
  <text x="191" y="229" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#B3421E">ə</text>
  <text x="209" y="229" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="10" fill="#888780">·</text>
  <rect x="217" y="216" width="26" height="18" rx="5" fill="#DFEAFA"/>
  <text x="230" y="229" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#2B5DA8">tʃ</text>
  <rect x="246" y="216" width="20" height="18" rx="5" fill="#FBE4E0"/>
  <text x="256" y="229" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#B3421E">ə</text>

  <!-- 音素细讲抽屉 -->
  <rect x="32" y="248" width="286" height="22" rx="8" fill="#F5F1E8" stroke="#C9BFA8" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="40" y="263" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#6B4614">音素细讲</text>
  <text x="310" y="263" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="9" fill="#6B4614">▼</text>

  <line x1="32" y1="278" x2="318" y2="278" stroke="#C9BFA8" stroke-width="0.7" stroke-dasharray="2 3"/>

  <rect x="32" y="284" width="20" height="16" rx="5" fill="#FBE4E0"/>
  <text x="42" y="296" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" font-weight="700" fill="#B3421E">ɪ</text>
  <text x="58" y="296" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#888780">第1节</text>
  <text x="88" y="296" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#444441">短元音：比 iː 松弛短促，同 sit</text>

  <rect x="32" y="306" width="20" height="16" rx="5" fill="#FBE4E0"/>
  <text x="42" y="318" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" font-weight="700" fill="#B3421E">ə</text>
  <text x="58" y="318" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#888780">第2节</text>
  <text x="88" y="318" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#444441">schwa：中央弱读，最懒的元音</text>

  <rect x="32" y="328" width="26" height="16" rx="5" fill="#DFEAFA"/>
  <text x="45" y="340" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" font-weight="700" fill="#2B5DA8">tʃ</text>
  <text x="64" y="340" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#888780">第4节</text>
  <text x="94" y="340" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#444441">塞擦音：t 与 ʃ 合体，先堵再摩擦放出</text>

  <rect x="32" y="350" width="38" height="16" rx="5" fill="#DFEAFA"/>
  <text x="51" y="361" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#2B5DA8">ture</text>
  <text x="78" y="361" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#444441">→ /tʃə/　同 nature / future / picture</text>

  <rect x="32" y="374" width="286" height="18" rx="6" fill="#F5F1E8"/>
  <text x="40" y="386" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#6B4614">要点：3 个 schwa——重音清晰，其余全部含糊</text>
  <text x="32" y="408" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#888780">（其余行同构：共 8 音素 · 2 组合 · 2 要点）</text>

  <text x="175" y="460" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#888780">旧数据（仅 p，无 syl/type）→ 中性灰 chip · 无抽屉</text>

  <!-- ② 数据结构 -->
  <text x="350" y="86" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#3F6328">② contentJson.syl（LLM 单次调用产出）</text>
  <rect x="350" y="96" width="310" height="248" rx="8" fill="#FAF7F0" stroke="#E5DFD0" stroke-width="1"/>

  <text x="366" y="114" font-family="'SF Mono',Menlo,monospace" font-size="10" font-weight="600" fill="#444441">"syl": {</text>
  <text x="366" y="129" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#444441">  "parts":  ["lit","e","ra","ture"],</text>
  <text x="366" y="144" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#444441">  "ipa":    ["lɪt","ə","rə","tʃə"],</text>
  <text x="366" y="159" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#444441">  "stress": 0,           <tspan fill="#888780">// 主重音下标</tspan></text>
  <text x="366" y="174" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#444441">  "phonemes": [          <tspan fill="#888780">// 顺序 = ipa 顺序</tspan></text>
  <text x="366" y="189" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#444441">    {"p":"l","syl":0,"type":"consonant",</text>
  <text x="366" y="204" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#444441">     "desc":"边音：舌尖抵上齿龈…"},</text>
  <text x="366" y="219" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#444441">    {"p":"ɪ","syl":0,"type":"vowel",</text>
  <text x="366" y="234" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#444441">     "desc":"短元音：比 iː 松弛…"},</text>
  <text x="366" y="249" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#888780">    … 共 8 个（4 元音 + 4 辅音）</text>
  <text x="366" y="264" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#444441">  ],</text>
  <text x="366" y="279" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#444441">  "combos": [{"letters":"ture",</text>
  <text x="366" y="294" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#444441">    "sound":"/tʃə/","desc":"同 nature…"}],</text>
  <text x="366" y="309" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#444441">  "notes": ["3 个 schwa，弱读为主…"]</text>
  <text x="366" y="324" font-family="'SF Mono',Menlo,monospace" font-size="10" font-weight="600" fill="#444441">}</text>

  <rect x="350" y="356" width="310" height="56" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="0.8"/>
  <text x="366" y="376" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="500" fill="#3F6328">完整性约束（导入校验，不过即拒收）</text>
  <text x="366" y="394" font-family="'SF Mono',Menlo,monospace" font-size="9.5" fill="#3F6328">Σ phonemes[].p 拼接 === ipa.join("")</text>
  <text x="366" y="408" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#3F6328">syl ∈ [0, parts.length) · type ∈ vowel / consonant</text>

  <rect x="350" y="424" width="310" height="52" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.8"/>
  <text x="366" y="442" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="500" fill="#0C447C">生成与兜底</text>
  <text x="366" y="458" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#0C447C">LLM 批生成 → 拼接校验 → 落库（与词根/熟词/搭配同次调用）</text>
  <text x="366" y="472" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#0C447C">缺 syl → 运行时元音峰规则兜底：仅字母色块，无音素层</text>

  <!-- 底部规则条 -->
  <rect x="40" y="492" width="600" height="64" rx="10" fill="#FAF7F0" stroke="#E5DFD0" stroke-width="0.8"/>
  <text x="60" y="514" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="500" fill="#2C2C2A">设计要点（v2.2）</text>
  <text x="60" y="532" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#5F5E5A">· 音节层管「读的节奏」（parts/ipa/stress），音素层管「每个音怎么发」（phonemes/combos/notes）</text>
  <text x="60" y="548" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#5F5E5A">· 落库换渲染零依赖；拼接约束可硬校验；运行时规则只做缺数据兜底，正面音节色块仍零成本</text>
</svg>
