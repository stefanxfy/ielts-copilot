<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="100%" role="img">
  <title>单词助记数据模型：affix 特殊词入 words 表 + contentJson 助记扩字段（v2.3）</title>
  <desc>不建独立 affix_words 表; 词根作为特殊 word 入 words 表(kind 存 contentJson); word_books 加 bookType; contentJson 扩 morph/contexts/pos, 删 affixBreakdown/trueWordSplit, collocations/llmInsight 保留</desc>

  <defs>
    <marker id="arrE" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L6 4 L0 8 Z" fill="#888780"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="520" fill="#FFFFFF"/>
  <text x="40" y="36" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">数据模型:affix 特殊词入 words 表 + contentJson 助记扩字段(v2.3)</text>
  <text x="40" y="54" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">v2.3: 不建 affix_words 表 · 全链路零改动复用 · 迁 0004 仅加 bookType 列 · contentJson 扩 morph/contexts/pos</text>

  <!-- 表 1: word_books 扩展 -->
  <rect x="30" y="80" width="260" height="120" rx="10" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
  <rect x="30" y="80" width="260" height="26" rx="10" fill="#E6F1FB" stroke="#888780" stroke-width="1"/>
  <text x="160" y="98" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="500" fill="#0C447C">word_books (扩展)</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#2C2C2A">
    <text x="44" y="124">id · name · type · lang · coverColor</text>
    <text x="44" y="142" font-weight="500" fill="#B85F4A">bookType: "word" | "affix"  ← 新(迁移 0004)</text>
    <text x="44" y="160" fill="#888780">  · affix: 词根词缀词书(背词根本身)</text>
    <text x="44" y="178" fill="#888780">  · word: 普通单词词书(默认)</text>
  </g>

  <!-- 表 2: words 表(affix 特殊词入表) -->
  <rect x="330" y="80" width="320" height="170" rx="10" fill="#FFFFFF" stroke="#7AA857" stroke-width="1"/>
  <rect x="330" y="80" width="320" height="26" rx="10" fill="#EAF3DE" stroke="#7AA857" stroke-width="1"/>
  <text x="490" y="98" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="500" fill="#3F6328">words (复用, 不建新表)</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#2C2C2A">
    <text x="344" y="124">word 列(全局 unique)</text>
    <text x="344" y="142">  "unbelievable" → 普通词(无 kind)</text>
    <text x="344" y="160" font-weight="500" fill="#3F6328">  "un-" / "believ" / "-able" → affix 特殊词</text>
    <text x="344" y="178" font-weight="500" fill="#B85F4A">contentJson.kind = "affix" ← 类型唯一权威标记</text>
    <text x="344" y="196" fill="#5F5E5A">富信息: meaning / meaningZh / examples</text>
    <text x="344" y="212" fill="#5F5E5A">        / derivatives / mnemonic</text>
    <text x="344" y="230" fill="#888780">unique(word) 撞名 → 导入跳过 + 告警日志</text>
  </g>

  <!-- 表 3: words.contentJson 扩展 -->
  <rect x="30" y="270" width="620" height="210" rx="10" fill="#FFFFFF" stroke="#D08F6A" stroke-width="1"/>
  <rect x="30" y="270" width="620" height="26" rx="10" fill="#F5E8E1" stroke="#D08F6A" stroke-width="1"/>
  <text x="340" y="288" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="500" fill="#7A2F1F">words.contentJson (扩字段, JSON 列直加无 DDL)</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#2C2C2A">
    <text x="44" y="314">展示型  translation · phonetic · audio.word · audio.sent</text>
    <text x="44" y="332">元数据  collins · bncRank · frqRank · tags · root(已有ECDICT)</text>
    <text x="44" y="350" font-weight="500" fill="#B85F4A">v2.3 新增(助记型)</text>
    <text x="44" y="368" fill="#5F5E5A">  morph: { type, literal, pieces:[{piece, kind, meaningZh, fromWord?}] }  ← 构词解析(替代词根词缀+熟词拆分)</text>
    <text x="44" y="386" fill="#5F5E5A">  derives: [{en, pos, zh}]   ← 派生·词性·近义(pos 在数组项内)</text>
    <text x="44" y="404" fill="#5F5E5A">  contexts: [{coll, en, zh}]   ← 语境(与词组搭配 1:1, 卡挂词组搭配卡)</text>
    <text x="44" y="422" fill="#5F5E5A">  collocations: [{en, zh, source}]   ← 词组搭配(保留)</text>
    <text x="44" y="440" fill="#5F5E5A">  llmInsight: {type, content} | null   ← LLM 解读(形态未定, 延期, 保留)</text>
    <text x="44" y="458" fill="#888780">  syl 音节由 LLM 独立调用落库; 有 morph 时按构词边界对齐展示</text>
  </g>

  <!-- 关联箭头: word_books → words -->
  <path d="M290 130 L330 130" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrE)"/>
  <text x="310" y="118" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#888780">1→N</text>

  <!-- 关联说明(底部空白区) -->
  <text x="44" y="500" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#888780">关联: word_books ↔ words 经 book_word_relation (1→N) · affix 词书与普通词书同构, 词根词条同入关联表</text>

  <!-- 关联箭头: words → contentJson 说明 -->
  <path d="M490 250 L490 270" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrE)"/>
</svg>
