<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="100%" role="img">
  <title>词库中心页面结构与数据流</title>
  <desc>词库列表页承接入口、导入弹窗与学习动线,数据来源 word_books 三表</desc>
  <rect x="0" y="0" width="680" height="360" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="36" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">词库中心:页面结构与数据流(#62)</text>

  <rect x="40" y="64" width="600" height="150" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="64" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#444441">/learn/books · 词库列表页</text>

  <rect x="64" y="106" width="170" height="88" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="78" y="130" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#444441">词库卡片</text>
  <text x="78" y="150" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">封面生图 + 来源徽章</text>
  <text x="78" y="167" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">词数/已学/配图统计</text>
  <text x="78" y="184" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">进度条 + 导入中 spinner</text>

  <rect x="254" y="106" width="170" height="88" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="268" y="130" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#444441">新建词库弹窗</text>
  <text x="268" y="150" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">粘贴 / 上传 txt 双 tab</text>
  <text x="268" y="167" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">格式提示:一行一词</text>
  <text x="268" y="184" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">生图策略三选</text>

  <rect x="444" y="106" width="170" height="88" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="458" y="130" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#444441">导入四步进度</text>
  <text x="458" y="150" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">解析去重 → 抓释义</text>
  <text x="458" y="167" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">→ TTS → 核心词生图</text>
  <text x="458" y="184" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">完成后出未命中清单</text>

  <path d="M234 150 L250 150" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow4)"/>
  <path d="M424 150 L440 150" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow4)"/>

  <path d="M300 214 L300 244" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <rect x="40" y="248" width="290" height="76" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="64" y="274" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#0C447C">POST /api/vocab-book(#61)</text>
  <text x="64" y="294" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#185FA5">{name, words[], genStrategy}</text>
  <text x="64" y="311" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#185FA5">异步任务 · 轮询 GET 任务状态</text>

  <rect x="350" y="248" width="290" height="76" rx="10" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
  <text x="374" y="274" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#27500A">学习动线</text>
  <text x="374" y="294" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3B6D11">卡片「开始学习」→ 选词入计划</text>
  <text x="374" y="311" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3B6D11">→ 认词卡/默写三型(已有原型)</text>
</svg>
