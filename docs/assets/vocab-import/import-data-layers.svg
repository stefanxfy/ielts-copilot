<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="100%" role="img">
  <title>词库导入数据来源分层</title>
  <desc>用户只输入单词,其余字段由百词斩/ECDICT/edge-tts/MiniMax 生图四层自动补齐</desc>
  <rect x="0" y="0" width="680" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="36" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">词库导入:其他信息从哪里来</text>

  <rect x="40" y="60" width="600" height="52" rx="10" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text x="64" y="80" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#712B13">用户输入</text>
  <text x="64" y="99" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#993C1D">一行一个英文单词(txt 粘贴/上传)</text>
  <rect x="470" y="74" width="150" height="24" rx="6" fill="#FFFFFF" stroke="#F0997B" stroke-width="0.5"/>
  <text x="545" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">唯一必填项:word</text>
  <path d="M340 112 L340 132" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <rect x="40" y="142" width="600" height="76" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="64" y="163" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#0C447C">百词斩 join(jsDelivr CDN)</text>
  <text x="64" y="181" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5">accent 音标 · mean_cn 中文释义 · mean_en 英释 · sentence 例句</text>
  <text x="64" y="200" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5">sentence_trans 例句中译 · sentence_phrase 短语 · word_etyma 词源</text>
  <text x="524" y="171" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#185FA5">10927 词</text>
  <path d="M340 218 L340 238" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <rect x="40" y="248" width="600" height="76" rx="10" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
  <text x="64" y="269" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#27500A">ECDICT 补全(本地 CSV/词根表)</text>
  <text x="64" y="287" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3B6D11">phonetic 美音标 · bncRank/frqRank 词频 · collins 星级 · tag 考试标签</text>
  <text x="64" y="306" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3B6D11">exchange 词形变化 · wordroot 词根归属 · translation 兜底释义</text>
  <text x="524" y="277" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3B6D11">77 万词条</text>
  <path d="M340 324 L340 344" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <rect x="40" y="354" width="294" height="66" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="60" y="375" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#633806">edge-tts 音频合成</text>
  <text x="60" y="393" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#854F0B">单词 mp3 + 例句 mp3 落盘</text>
  <text x="60" y="410" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#854F0B">免 key · 英音 Ryan</text>

  <rect x="346" y="354" width="294" height="66" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="366" y="375" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#3C3489">MiniMax 生图(核心词)</text>
  <text x="366" y="393" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#534AB7">场景化配图 png 落盘</text>
  <text x="366" y="410" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#534AB7">按 collins/bnc 阈值筛核心词</text>

  <path d="M340 420 L340 436" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <rect x="40" y="446" width="600" height="52" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="64" y="466" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#085041">words.contentJson 汇总落库</text>
  <text x="64" y="485" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0F6E56">富字段 JSON 列合并 · mp3/png 只存路径 · origin 记录血缘</text>
</svg>
