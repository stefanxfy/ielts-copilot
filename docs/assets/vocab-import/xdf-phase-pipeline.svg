<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="100%" role="img">
  <title>入库五阶段流水线</title>
  <desc>文本入库到验收建计划的五个阶段,每阶段带门禁</desc>
  <rect x="0" y="0" width="680" height="250" fill="#FFFFFF"/>
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">入库五阶段(每阶段有门禁,不过不进下一阶段)</text>

  <rect x="30" y="70" width="112" height="88" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="86" y="94" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#444441">P0 文本入库</text>
  <text x="86" y="116" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">转换+去重+归一化</text>
  <text x="86" y="132" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">门禁:数量核对</text>
  <text x="86" y="147" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">'残留=0 · 抽样对拍</text>

  <rect x="162" y="70" width="112" height="88" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="218" y="94" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#444441">P1 ECDICT 富化</text>
  <text x="218" y="116" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">bnc/collins/tags</text>
  <text x="218" y="132" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">门禁:覆盖率</text>
  <text x="218" y="147" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">≥98% · 幂等重跑</text>

  <rect x="294" y="70" width="112" height="88" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="350" y="94" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#0C447C">P2 TTS 音频</text>
  <text x="350" y="116" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">词 Andrew · 句 Emma</text>
  <text x="350" y="132" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">门禁:文件数=预期</text>
  <text x="350" y="147" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">&gt;1KB 才回写路径</text>

  <rect x="426" y="70" width="112" height="88" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="482" y="94" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#0C447C">P3 助记分期</text>
  <text x="482" y="116" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">syl 必跑 · morph 种子</text>
  <text x="482" y="132" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">门禁:音标一致性</text>
  <text x="482" y="147" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">全绿 · coll∈en</text>

  <rect x="558" y="70" width="92" height="88" rx="10" fill="#EAF5EC" stroke="#8FC9A2" stroke-width="0.5"/>
  <text x="604" y="94" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#1E5B33">P4/P5 生图·验收</text>
  <text x="604" y="116" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">生图后置 · 冒烟</text>
  <text x="604" y="132" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">门禁:agent-browser</text>
  <text x="604" y="147" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#888780">冒烟 · 分批建计划</text>

  <path d="M142 114 L158 114" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowP)"/>
  <path d="M274 114 L290 114" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowP)"/>
  <path d="M406 114 L422 114" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowP)"/>
  <path d="M538 114 L554 114" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowP)"/>

  <text x="40" y="196" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">P0/P1 小时级 · P2 约 11500 次合成(分批后台,数小时) · P3 首期 syl+morph 约 5900 LLM 调用(分期推进)</text>
  <text x="40" y="214" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">P4 生图后置独立推进 · contexts LLM 条目随学随补 · derives 直转省 ~2400 调用</text>
  <text x="40" y="238" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">3575 词不一次性入学习计划:按 wordRank 每批 50-100 经选词页加入,节奏由 FSRS 每日新词上限控制</text>
</svg>
