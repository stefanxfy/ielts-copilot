<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img">
  <title>背单词学习动线</title>
  <desc>从词库中心到复习完成的用户主路径与循环,学习台展示今日进度与词书进度条</desc>
  <rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>
  <defs>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="36" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">背单词主动线:导词 → 选词 → 复习循环</text>

  <rect x="40" y="64" width="170" height="96" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="56" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#0C447C">1 · 词库中心</text>
  <text x="56" y="110" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#185FA5">/learn/books</text>
  <text x="56" y="127" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#185FA5">新建/导入词书</text>
  <text x="56" y="144" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#185FA5">点词书卡 → 词表浏览</text>

  <rect x="255" y="64" width="170" height="96" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="271" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#0C447C">2 · 词表浏览(词库中心内)</text>
  <text x="271" y="110" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#185FA5">/learn/books/[bookId]</text>
  <text x="271" y="127" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#185FA5">浏览词表 · 试听</text>
  <text x="271" y="144" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#185FA5">勾选加入背诵计划</text>

  <rect x="470" y="64" width="170" height="96" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="486" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#633806">3 · 学习台</text>
  <text x="486" y="110" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#854F0B">/learn</text>
  <text x="486" y="127" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#854F0B">今日进度 10/30</text>
  <text x="486" y="144" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#854F0B">在背词书进度条</text>

  <path d="M210 112 L251 112" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowFlow)"/>
  <path d="M425 112 L466 112" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowFlow)"/>

  <path d="M555 164 L555 200" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowFlow)"/>
  <text x="547" y="186" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A">点「开始复习」</text>

  <rect x="130" y="204" width="420" height="110" rx="10" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
  <text x="150" y="230" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#27500A">4 · 复习 session(/learn/review)</text>
  <text x="150" y="250" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3B6D11">认词卡(新词起步) → 连续 2 次认识升级默写</text>
  <text x="150" y="267" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3B6D11">默写三型按 vocab-card-policy 抽取:视觉 40 / 听觉 30 / 语境 30</text>
  <text x="150" y="284" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3B6D11">无图词自动剔除视觉型;评分 Good/Hard/Again 折算 FSRS 回写</text>
  <text x="150" y="301" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3B6D11">交互细节照抄 prototype/vocab/card-demo 已验证原型</text>

  <path d="M130 259 L96 259 L96 150" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowFlow)"/>
  <text x="52" y="210" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A">答完回学习台</text>
  <text x="46" y="226" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A">进度 +1</text>

  <path d="M550 259 L612 259 L612 172" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowFlow)"/>
  <text x="618" y="196" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A">FSRS 算到期</text>
  <text x="618" y="212" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A">明日再来</text>

  <rect x="40" y="336" width="600" height="40" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="56" y="352" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A">学习台无打卡日历/到期队列:今日进度 10/30(累计完成/今日计划)在「开始复习」按钮上方以进度条</text>
  <text x="56" y="368" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A">+数字呈现;按词书分行展示各书进度条,beginner 友好,一眼看到"还剩多少"。</text>
</svg>
