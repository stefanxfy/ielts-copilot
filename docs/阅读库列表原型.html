<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="ipWAFMwt6H0dj8GcrMNz3E">
<head data-page-node-id="wS9CodSUuZlZgZTznp0vMg">
<meta charset="UTF-8" data-page-node-id="shrUOg6IPn6sMZaBsSjhTp">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="Y6eGg3bsDQLs0cIPjp1ISO">
<title>阅读库 · 文章列表原型</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --ink:#26261f; --ink2:#6b6a62; --ink3:#9a988d;
    --line:#e3e1d8; --accent:#0f6e56; --accent-bg:#e1f5ee; --amber:#ba7517; --amber-bg:#faeeda;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.7;}
  .wrap{max-width:880px;margin:0 auto;padding:0 16px 60px;}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(246,245,241,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 0 12px;}
  h1{font-size:19px;font-weight:600;}
  .sub{font-size:12px;color:var(--ink3);margin-top:2px;}
  .filters{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}
  .fgroup{display:flex;gap:6px;align-items:center;}
  .flabel{font-size:12px;color:var(--ink3);}
  .chip{font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;cursor:pointer;color:var(--ink2);}
  .chip.on{color:var(--accent);border-color:var(--accent);background:var(--accent-bg);}

  .resume{margin-top:16px;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:16px 18px;cursor:pointer;}
  .resume:hover{background:#fbfdfc;}
  .rhead{display:flex;align-items:center;gap:8px;}
  .rtitle{font-weight:600;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rmeta{font-size:12px;color:var(--ink2);margin-top:4px;}
  .rbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px;}
  .rbar i{display:block;height:100%;background:var(--accent);}
  .rfoot{font-size:12px;color:var(--accent);margin-top:6px;}

  .section{font-size:13px;color:var(--ink2);margin:20px 0 4px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:10px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s;}
  .card:hover{border-color:var(--accent);}
  .ctitle{font-weight:600;font-size:14.5px;line-height:1.5;}
  .cmeta{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .badge{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent);}
  .badge.lv{background:var(--amber-bg);color:var(--amber);}
  .badge.topic{background:#f1efe8;color:var(--ink2);}
  .cinfo{font-size:12px;color:var(--ink3);margin-top:6px;}
  .cbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px;}
  .cbar i{display:block;height:100%;background:var(--accent);}
  .cstate{font-size:12px;color:var(--ink3);margin-top:5px;}
  .cstate.done{color:var(--accent);}
  .empty{color:var(--ink3);font-size:13px;padding:30px 0;text-align:center;}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 18px;border-radius:999px;opacity:0;transition:opacity .25s;z-index:50;pointer-events:none;}
  .toast.show{opacity:.92;}
</style>
</head>

<div class="topbar" data-page-node-id="KZG18yllXJhcygNdGBn7rH"><div class="wrap" data-page-node-id="2OXJxI1ZqhdlcQWWHFwhX3">
  <h1 data-page-node-id="gfUWRpmjkZfDChVOEnWfQE">阅读库</h1>

<div class="wrap" data-page-node-id="Th60zNqcN9L7YIW1U2HvGU">
  <div id="resumeBox" data-page-node-id="fY8nVm2PdXgTZ0y5Igz7Vg"></div>
  <div class="section" data-page-node-id="eOcIlbZUzlfSZZoqV4PR7o">全部文章</div>

<script>
const DATA=[
 {t:"The Impact of Urban Noise on Health",src:"past_paper",ref:"Cambridge 19 · T1 · P2",lv:"L3",wc:847,topic:"environment",prog:35,pos:2,total:6},
 {t:"Why We Make Irrational Economic Choices",src:"past_paper",ref:"Cambridge 19 · T1 · P3",lv:"L3",wc:912,topic:"psychology",prog:0,pos:0,total:7},
 {t:"The Secret Lives of Urban Trees",src:"past_paper",ref:"Cambridge 18 · T3 · P1",lv:"L2",wc:703,topic:"environment",prog:100,pos:7,total:7},
 {t:"Inside the Antikythera Mechanism",src:"past_paper",ref:"Cambridge 18 · T2 · P3",lv:"L4",wc:1038,topic:"history",prog:0,pos:0,total:8},
 {t:"Coral Reefs and the Chemistry of Warming Seas",src:"past_paper",ref:"Cambridge 20 · T1 · P2",lv:"L3",wc:876,topic:"environment",prog:0,pos:0,total:6},
 {t:"The Psychology of Language Learning",src:"past_paper",ref:"Cambridge 20 · T2 · P1",lv:"L2",wc:689,topic:"education",prog:0,pos:0,total:6},
 {t:"Sleep and the Consolidation of Memory",src:"web",ref:"Aeon",lv:"L4",wc:1180,topic:"psychology",prog:0,pos:0,total:9},
 {t:"How Cities Are Reclaiming Their Rivers",src:"web",ref:"National Geographic",lv:"L3",wc:940,topic:"environment",prog:0,pos:0,total:7},
 {t:"The Economics of Congestion Charging",src:"web",ref:"Scientific American",lv:"L3",wc:858,topic:"economy",prog:0,pos:0,total:6},
 {t:"Reading the Past: Cuneiform and the First Libraries",src:"web",ref:"Smithsonian",lv:"L4",wc:1105,topic:"history",prog:0,pos:0,total:8},
 {t:"Learning a Second Language as an Adult",src:"web",ref:"New Scientist",lv:"L2",wc:640,topic:"education",prog:0,pos:0,total:5},
 {t:"Bamboo: The Grass That Builds Skyscrapers",src:"web",ref:"DreamReader",lv:"L2",wc:595,topic:"science",prog:0,pos:0,total:5}
];
const F={src:"all",lv:"all"};
const TOPIC_CN={environment:"环境",psychology:"心理",history:"历史",education:"教育",economy:"经济",science:"科学"};

const resume=DATA.find(a=>a.prog>0&&a.prog<100);
const rb=document.getElementById("resumeBox");
if(resume){
  rb.innerHTML="<div class='resume' onclick='toast(\"续读：定位到段 "+(resume.pos+1)+"（阅读器原型见 阅读器原型.html）\")'>"+
   "<div class='rhead'><div class='rtitle'>继续阅读 · "+resume.t+"</div><span class='badge'>"+resume.ref+"</span><span class='badge lv'>"+resume.lv+"</span></div>"+
   "<div class='rmeta'>读到第 "+(resume.pos+1)+" / "+resume.total+" 段 · 上次："+resume.ref+"</div>"+
   "<div class='rbar'><i style='width:"+resume.prog+"%'></i></div>"+
   "<div class='rfoot'>续读 →</div></div>";
}

function render(){
  const list=DATA.filter(a=>(F.src==="all"||a.src===F.src)&&(F.lv==="all"||a.lv===F.lv));
  document.getElementById("grid").innerHTML=list.map(card).join("");
  document.getElementById("empty").style.display=list.length?"none":"block";
}
function card(a){
  const bar=a.prog>0?"<div class='cbar'><i style='width:"+a.prog+"%'></i></div>":"";
  const st=a.prog>=100?"<div class='cstate done'>已读完 ✓</div>":a.prog>0?"<div class='cstate'>已读 "+a.prog+"%</div>":"<div class='cstate'>未开始</div>";
  return "<div class='card' onclick='toast(\"进入阅读器（阅读器原型见 阅读器原型.html）\")'>"+
   "<div class='ctitle'>"+a.t+"</div>"+
   "<div class='cmeta'><span class='badge'>"+a.ref+"</span><span class='badge lv'>"+a.lv+"</span><span class='badge topic'>"+TOPIC_CN[a.topic]+"</span></div>"+
   "<div class='cinfo'>"+a.wc+" 词 · "+a.total+" 段 · 段级音频 ✓</div>"+bar+st+"</div>";
}
document.querySelectorAll(".chip").forEach(c=>{
  c.addEventListener("click",()=>{
    F[c.dataset.f]=c.dataset.v;
    document.querySelectorAll(".chip[data-f='"+c.dataset.f+"']").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); render();
  });
});
render();
let toastTimer=null;
function toast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2000);
}
</script>
</body>
</html>
