<!DOCTYPE html>

<title>阅读库 · 阅读器原型</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --ink:#26261f; --ink2:#6b6a62; --ink3:#9a988d;
    --line:#e3e1d8; --accent:#0f6e56; --accent-bg:#e1f5ee; --amber:#ba7517; --amber-bg:#faeeda;
    --red:#a32d2d; --card-radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; font-size:15px; line-height:1.7;}
  .wrap{max-width:760px; margin:0 auto; padding:0 16px 96px;}

  .topbar{position:sticky; top:0; z-index:20; background:rgba(246,245,241,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:12px 0 10px;}
  .topbar .row{display:flex; align-items:center; gap:10px;}
  .back{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none;}
  .title{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .src{font-size:12px;color:var(--ink3);margin-top:2px;}
  .badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent);margin-left:6px;vertical-align:1px;}
  .badge.lv{background:var(--amber-bg);color:var(--amber);}
  .tools{display:flex;gap:8px;margin-top:8px;align-items:center;}
  .tool{font-size:12px;color:var(--ink2);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;cursor:pointer;}
  .tool.on{color:var(--accent);border-color:var(--accent);background:var(--accent-bg);}
  .hint{font-size:12px;color:var(--ink3);margin-left:auto;}

  .para{background:var(--card);border:1px solid var(--line);border-radius:var(--card-radius);margin-top:14px;padding:16px 18px;position:relative;transition:border-color .2s;}
  .para.playing{border-color:var(--accent);border-left:4px solid var(--accent);}
  .para .head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .playbtn{width:30px;height:30px;border-radius:50%;border:none;background:var(--accent-bg);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
  .para.playing .playbtn{background:var(--accent);color:#fff;}
  .pidx{font-size:12px;color:var(--ink3);}
  .ptime{font-size:12px;color:var(--ink3);margin-left:auto;}
  .more{font-size:12px;color:var(--ink3);border:none;background:none;cursor:pointer;padding:2px 6px;}
  .pbar{height:3px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden;opacity:0;}
  .para.playing .pbar{opacity:1;}
  .pbar i{display:block;height:100%;width:0;background:var(--accent);}
  .entext{font-size:16.5px;line-height:1.85;}
  .hit{cursor:pointer;text-decoration:underline wavy var(--amber);text-underline-offset:4px;}
  .hit.invocab{text-decoration:underline wavy var(--red);text-underline-offset:4px;}
  .zhblock{margin-top:12px;background:var(--bg);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--ink2);display:none;}
  .para.zh-open .zhblock{display:block;}
  .zh-tag{font-size:11px;color:var(--ink3);margin-bottom:2px;}
  .zhbtn{font-size:12px;color:var(--ink3);border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:1px 8px;margin-left:6px;cursor:pointer;vertical-align:2px;}
  .zhbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-bg);}

  .card{position:absolute;z-index:40;width:300px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.12);padding:14px 16px;display:none;}
  .card .w{display:flex;align-items:baseline;gap:10px;}
  .card .w b{font-size:19px;font-weight:600;}
  .card .ph{font-size:13px;color:var(--ink3);}
  .card .say{margin-left:auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
  .card .sec{margin-top:10px;font-size:13px;}
  .card .sec h5{font-size:11px;color:var(--ink3);font-weight:400;margin-bottom:2px;}
  .card .add{margin-top:12px;width:100%;padding:7px 0;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13px;cursor:pointer;}
  .card .add.done{background:var(--bg);color:var(--ink3);border:1px solid var(--line);cursor:default;}

  .bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);z-index:30;}
  .bottom .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;}
  .prog{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
  .prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s;}
  .stat{font-size:12px;color:var(--ink2);white-space:nowrap;}
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 18px;border-radius:999px;opacity:0;transition:opacity .25s;z-index:50;pointer-events:none;}
  .toast.show{opacity:.92;}
</style>
</head>

<div class="topbar" data-page-node-id="phLZrCMoAwxVQTH6PE2kWI"><div class="wrap" data-page-node-id="QEOwElWWsRPrJ5OhkJe3I6">

  <div class="w" data-page-node-id="cZNGX6KXclGnhRVM2nbFpx"><b id="cw" data-page-node-id="wRLM7euwhITafBFvu5mNes"></b><span class="ph" id="cph" data-page-node-id="TLgKvso6GJBDazNbPyuY9b"></span>

  </div>

  <div class="sec" data-page-node-id="C5nxmKSQuGTZdfzZNGhpxj"><h5 data-page-node-id="My93pOri8FnojEvdQTH86a">构词解析</h5><div id="croot" style="color:var(--ink2)" data-page-node-id="isgAy0IsYcMhPMypuPJK8M"></div></div>
  <div class="sec" data-page-node-id="5PK4Tyrb5BtDKx3Ejazg4S"><h5 data-page-node-id="5wFQ11wLm8FzPgGsQXxtwG">词形变化</h5><div id="cexc" style="color:var(--ink2)" data-page-node-id="Kv4sch01q9Akb1XQQYMKT3"></div></div>

</div></div>

<script>
const DATA=[
 {en:"Noise pollution has become one of the most pervasive yet under-regulated hazards of modern urban life. Unlike air or water contamination, its effects are invisible, and its sources — traffic, construction, aircraft — are woven into the fabric of daily existence. Recent epidemiological studies suggest that chronic exposure to elevated noise levels is associated not only with hearing impairment but also with cardiovascular disease, sleep disturbance and cognitive decline in children.",
  zh:"噪声污染已成为现代城市生活中最普遍却受监管最少的危害之一。与空气或水污染不同，其影响是无形的，其来源——交通、建筑、飞机——则交织在日常生活结构之中。最近的流行病学研究表明，长期暴露于高噪声水平不仅与听力损伤相关，还与心血管疾病、睡眠障碍及儿童认知能力下降有关。",
  dur:38, hits:["pervasive","chronic","exposure","impairment","cognitive"]},
 {en:"The mechanism underlying these outcomes is well documented. Noise triggers a stress response in which the body releases cortisol and adrenaline, elevating heart rate and blood pressure even during sleep, when the sufferer may remain unaware of the disturbance. Over time, researchers argue, this repeated activation contributes to the deterioration of the cardiovascular system.",
  zh:"这些健康后果背后的机制已有充分记录。噪声会触发应激反应，使身体释放皮质醇和肾上腺素，即使在睡眠期间也会升高心率和血压，而受影响者可能并未察觉这种干扰。研究人员认为，长期反复的激活会逐渐导致心血管系统的恶化。",
  dur:30, hits:["mechanism","cortisol","deterioration","cardiovascular"]},
 {en:"Policy responses have lagged behind the science. While legislation governing air quality dates back decades, comprehensive noise mapping exists in only a handful of jurisdictions, and enforcement is frequently delegated to under-resourced municipal authorities.",
  zh:"政策应对落后于科学进展。尽管空气质量立法可追溯至数十年前，但全面的噪声地图仅在少数司法管辖区存在，且执法常被下放给资源不足的市政机构。",
  dur:24, hits:["jurisdictions","enforcement","municipal"]},
 {en:"Some cities have begun to experiment with mitigation. Barcelona is piloting superblocks that reroute through-traffic, while Paris has installed noise-detecting cameras that fine excessively loud vehicles. Early evaluations suggest measurable reductions in ambient sound levels, though critics caution that such schemes risk displacing traffic, and the noise it generates, to less affluent neighbourhoods.",
  zh:"一些城市已开始尝试缓解措施。巴塞罗那正在试点将过境交通改道的「超级街区」，巴黎则安装了噪声检测摄像头，对过分嘈杂的车辆罚款。早期评估显示环境声级有可测量的下降，但批评者警告，这类方案可能把交通及其产生的噪声转移到欠富裕的社区。",
  dur:40, hits:["mitigation","ambient","affluent","evaluations"]},
 {en:"Individual interventions are equally contested. Sound insulation can shield residents near flight paths, but it is costly and often rented properties are excluded from subsidy schemes. Behavioural advice — closing windows, wearing earplugs — places the burden on the sufferer rather than the source.",
  zh:"个人层面的干预同样存在争议。隔音设施可以保护航线附近的居民，但成本高昂，且出租房屋常被排除在补贴计划之外。诸如关窗、戴耳塞之类的行为建议，是把负担转嫁给受害者而非污染源。",
  dur:28, hits:["insulation","subsidy","interventions"]},
 {en:"What the evidence increasingly demands is a shift in perspective: noise should be treated not as an unavoidable by-product of urbanisation, but as a public health variable that can be measured, regulated and reduced — with the same seriousness currently reserved for particulate matter.",
  zh:"越来越多的证据要求一种视角的转变：噪声不应被视为城市化不可避免的副产品，而应被视为一个可测量、可监管、可削减的公共健康变量——以目前对待颗粒物的同等严肃程度来对待它。",
  dur:26, hits:["urbanisation","particulate","by-product"]}
];
const DICT={
 exposure:{ph:"/ɪkˈspəʊʒə(r)/",tr:"n. 暴露；接触；曝光",root:"ex-(向外) + pos(放置) + -ure(名词后缀) → 暴露在外",exc:"expose v. / exposed adj. / exposure n."},
 chronic:{ph:"/ˈkrɒnɪk/",tr:"adj. 长期的，慢性的",root:"chron(时间，同 chronology) + -ic → 长时间的",exc:"chronically adv. / chronology n. 时间序列"},
 deterioration:{ph:"/dɪˌtɪəriəˈreɪʃn/",tr:"n. 恶化，变坏",root:"deterior(更坏，拉丁 deterior) + -ate + -ion → 变得更坏",exc:"deteriorate v. / deteriorating adj."},
 mitigation:{ph:"/ˌmɪtɪˈɡeɪʃn/",tr:"n. 缓解，减轻",root:"mitig(软，缓和) + -ation → 使缓和",exc:"mitigate v. / mitigating adj."},
 pervasive:{ph:"/pəˈveɪsɪv/",tr:"adj. 普遍的，弥漫的",root:"per-(贯穿) + vas(走，同 invade) + -ive → 遍布各处的",exc:"pervasively adv. / pervasiveness n."},
 impairment:{ph:"/ɪmˈpeəmənt/",tr:"n. 损伤，损害",root:"im-(进入) + pair(坏，同 pejorative) + -ment → 弄坏",exc:"impair v. / impaired adj."},
 affluent:{ph:"/ˈæfluənt/",tr:"adj. 富裕的",root:"af-(向) + flu(流，同 flow) + -ent → 富得流油的",exc:"affluence n. / affluently adv."},
 cardiovascular:{ph:"/ˌkɑːdiəʊˈvæskjələ(r)/",tr:"adj. 心血管的",root:"cardi(心) + o + vascul(血管) + -ar",exc:"cardiovascular disease 心血管疾病"}
};
const INVOCAB=new Set(["exposure"]);

let chain=true, playing=-1, timer=null, readSec=0, readTimer=null;
const parasEl=document.getElementById("paras");
DATA.forEach((p,i)=>{
  const d=document.createElement("div");
  d.className="para"; d.id="para"+i;
  let en=p.en;
  p.hits.forEach(w=>{
    const key=Object.keys(DICT).find(k=>w.startsWith(k));
    en=en.replace(w,"<span class='hit"+(INVOCAB.has(key)?" invocab":"")+"' data-w='"+key+"' onclick='showCard(this,event)'>"+w+"</span>");
  });
  d.innerHTML="<div class='head'><button class='playbtn' onclick='togglePlay("+i+")' id='pb"+i+"'>"+playSvg()+"</button>"+
   "<span class='pidx'>段 "+(i+1)+"</span><span class='ptime'>"+p.dur+"s</span>"+
   "<button class='more' onclick='toast(\"重播 / 复制本段 / 送入打字练习（二期）\")'>⋯</button></div>"+
   "<div class='entext'>"+en+"<button class='zhbtn' id='zb"+i+"' onclick='toggleZh("+i+",event)'>译</button></div><div class='zhblock'><div class='zh-tag'>中文对照</div>"+p.zh+"</div>"+
   "<div class='pbar'><i id='bar"+i+"'></i></div>";
  parasEl.appendChild(d);
});
function toggleZh(i,e){
  if(e) e.stopPropagation();
  const d=document.getElementById("para"+i);
  const open=d.classList.toggle("zh-open");
  document.getElementById("zb"+i).classList.toggle("on",open);
}
function playSvg(){return "<svg width='13' height='13' viewBox='0 0 24 24' fill='currentColor'><path d='M8 5v14l11-7z'/></svg>";}

let currentWord="";
function showCard(el,e){
  currentWord=el.dataset.w; const info=DICT[currentWord]; if(!info)return;
  const c=document.getElementById("wordCard");
  document.getElementById("cw").textContent=currentWord;
  document.getElementById("cph").textContent=info.ph;
  document.getElementById("ctr").textContent=info.tr;
  document.getElementById("croot").textContent=info.root;
  document.getElementById("cexc").textContent=info.exc;
  const btn=document.getElementById("cadd");
  const inV=INVOCAB.has(currentWord);
  btn.textContent=inV?"已在生词本 ✓":"加入生词本";
  btn.classList.toggle("done",inV);
  c.style.display="block";
  const para=el.closest(".para"), r=el.getBoundingClientRect(), pr=para.getBoundingClientRect();
  let top=el.offsetTop+34; if(top+300>para.offsetHeight+40) top=Math.max(8,para.offsetHeight-300);
  c.style.top=top+"px";
  c.style.left=Math.min(Math.max(10,r.left-pr.left-130),para.offsetWidth-312)+"px";
  e.stopPropagation();
}
function addVocab(){
  INVOCAB.add(currentWord);
  document.querySelectorAll(".hit[data-w='"+currentWord+"']").forEach(s=>s.classList.add("invocab"));
  const btn=document.getElementById("cadd");
  btn.textContent="已在生词本 ✓"; btn.classList.add("done");
  toast("已加入生词本，将进入背单词复习队列");
}
document.addEventListener("click",e=>{ if(!e.target.closest(".card")&&!e.target.classList.contains("hit")) document.getElementById("wordCard").style.display="none"; });
function speak(w){ try{ const u=new SpeechSynthesisUtterance(w); u.lang="en-GB"; u.rate=.9; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(err){ toast("浏览器不支持语音合成"); } }

function togglePlay(i){ if(playing===i){stop();return;} start(i); }
function start(i){
  stop(); playing=i;
  const d=document.getElementById("para"+i); d.classList.add("playing");
  d.scrollIntoView({behavior:"smooth",block:"center"});
  let t=0; const dur=DATA[i].dur;
  document.getElementById("pb"+i).innerHTML="<svg width='13' height='13' viewBox='0 0 24 24' fill='currentColor'><path d='M6 5h4v14H6zM14 5h4v14h-4z'/></svg>";
  timer=setInterval(()=>{
    t+=.25; readSec+=.25;
    document.getElementById("bar"+i).style.width=Math.min(100,t/dur*100)+"%";
    updStat();
    if(t>=dur){
      document.getElementById("bar"+i).style.width="100%";
      if(chain && i<DATA.length-1){ start(i+1); } else stop();
    }
  },250);
  if(!readTimer) readTimer=setInterval(updStat,1000);
}
function stop(){
  clearInterval(timer); timer=null;
  if(playing>=0){
    const d=document.getElementById("para"+playing);
    d.classList.remove("playing");
    document.getElementById("pb"+playing).innerHTML=playSvg();
  }
  playing=-1;
}
function toggleChain(){ chain=!chain; document.getElementById("chain").textContent="连播："+(chain?"开":"关"); }
function updStat(){
  const done=DATA.slice(0,Math.max(0,playing)).reduce((a,p)=>a+p.dur,0);
  const pct=playing<0?0:(done+parseFloat(document.getElementById("bar"+playing)?.style.width||0)/100*DATA[playing].dur)/DATA.reduce((a,p)=>a+p.dur,0)*100;
  document.getElementById("bprog").style.width=Math.min(100,pct)+"%";
  document.getElementById("bstat").textContent="段 "+(playing>=0?playing+1:0)+"/"+DATA.length+" · 已读 "+Math.floor(readSec/60)+":"+String(Math.floor(readSec%60)).padStart(2,"0");
}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}
</script>
</body>
</html>
